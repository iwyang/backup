<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>计数器拨珠演示：整十、整百数乘一位数</title>
<style>
  :root{
    --bg:#f0f0f0; --ink:#222; --red:#d8281c; --panel:#fff; --line:#d9d4c0;
    --rod:#e0a020; --box:#fbf5c8; --btn:#2b6cb0; --btn-ink:#fff; --muted:#666;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#1b1c1f;--ink:#eee;--panel:#26282c;--line:#44464c;--box:#4a452a;--muted:#aaa;--red:#ff6a5c;--btn:#4a90d9}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","SimSun",serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:0 0 4px;font-weight:700}
  .sub{color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.7}
  .sub b{color:var(--red)}
  .board{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 10px 12px;width:330px;
    opacity:.35;transition:opacity .4s}
  .panel.on{opacity:1}
  .eq{font-size:30px;height:44px;text-align:center;font-family:"Times New Roman","Noto Serif SC",serif;white-space:pre}
  .eq .ans{display:inline-block;min-width:1.5em;text-align:left}
  .eq .ans.show{animation:pop .4s}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  svg{display:block;width:100%;height:auto}
  .cap{min-height:52px;text-align:center;font-size:17px;line-height:1.6;margin-top:6px}
  .cap .r{color:var(--red);font-weight:700}
  .bead{transition:transform .55s cubic-bezier(.3,1.3,.5,1),opacity .2s}
  .rodlabel{font-size:15px;fill:var(--ink)}
  .rodlabel .r{fill:var(--red);font-size:18px;font-weight:700}
  .hl{fill:none;stroke:var(--red);stroke-width:2.5;opacity:0;transition:opacity .3s}
  .hl.on{opacity:1}
  .ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 10px}
  button{font:inherit;font-size:16px;padding:9px 22px;border:0;border-radius:8px;background:var(--btn);color:var(--btn-ink);cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.4;cursor:default}
  .say{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:8px;padding:12px 16px;
    margin-top:14px;font-size:17px;line-height:1.8;min-height:62px}
  .say .r{color:var(--red);font-weight:700}
  .speed{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}

  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 22px}
  .tab.act{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
  .sec{display:none}.sec.act{display:block}
  .pbox{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 16px}
  .q{font-size:34px;text-align:center;font-family:"Times New Roman","Noto Serif SC",serif;margin:2px 0}
  .qhint{text-align:center;font-size:17px;color:var(--muted);min-height:28px}
  .qhint .r,.fb .r{color:var(--red);font-weight:700}
  svg.pab{touch-action:manipulation;user-select:none}
  svg.pab .zone{fill:transparent;cursor:pointer}
  svg.pab .zone:hover{fill:rgba(216,40,28,.07)}
  svg.pab .pb{cursor:pointer}
  svg.pab .pm{cursor:pointer}svg.pab .pm:hover circle{opacity:.8}
  .readout{display:flex;justify-content:center;gap:26px;font-size:18px;margin:4px 0}
  .readout span b{color:var(--red);font-size:22px}
  .fb{text-align:center;min-height:56px;font-size:19px;line-height:1.7;margin-top:6px}
  .fb.ok{color:#1c8a3a}.fb.no{color:var(--red)}
  .score{text-align:center;color:var(--muted);font-size:15px;margin-top:4px}
  .shake{animation:shk .4s}
  @keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.panel .fb{font-size:16px;min-height:50px}.panel .readout{font-size:15px;gap:14px}.panel .readout b{font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">拨珠过程演示</h1>
  <p class="sub" id="sub">把整十、整百数看成几个十、几个百，再用表内乘法 <b>2×3=6</b> 来计算。点击「播放」观看，或用「下一步」逐步讲解。</p>

  <div class="tabs">
    <button class="tab act" data-t="demo">老师演示</button>
    <button class="tab" data-t="prac">学生练习</button>
  </div>
<div class="sec act" id="sec-demo">
  <div class="board" id="board"></div>

  <div class="say" id="say">点击「播放」开始演示。</div>

  <div class="ctrl">
    <button id="play">▶ 播放</button>
    <button id="next" class="ghost">下一步</button>
    <button id="reset" class="ghost">↺ 重置</button>
    <label class="speed">速度
      <input type="range" id="speed" min="0.5" max="2" step="0.25" value="1">
    </label>
  </div>
</div>

<div class="sec" id="sec-prac">
  <div class="board" id="pboard"></div>
  <div class="ctrl">
    <button id="chk">检查答案</button>
    <button id="undo" class="ghost">↶ 撤销</button>
    <button id="clr" class="ghost">清空</button>
    <button id="nq" class="ghost">换一题</button>
  </div>
  <div class="score" id="score"></div>
</div>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const COLS = [
  {pos:2, name:"个位", unit:"一", n:"2",   m:"6",   eq:"2×3",   word:"个一"},
  {pos:1, name:"十位", unit:"十", n:"20",  m:"60",  eq:"20×3",  word:"个十"},
  {pos:0, name:"百位", unit:"百", n:"200", m:"600", eq:"200×3", word:"个百"},
];
const RODX = [33, 93, 153];      // 百 十 个
const BASE = 214, BH = 15.5;

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- 构建三个计数器 ----------
const board = document.getElementById("board");
const panels = COLS.map((c, ci) => {
  const p = document.createElement("div");
  p.className = "panel";
  p.innerHTML = `<div class="eq"><span>${c.eq.replace("×"," × ")} = </span><span class="ans"></span></div>`;
  const svg = el("svg", {viewBox:"0 0 186 250"});
  const defs = el("defs", {}, svg);
  const g = el("radialGradient", {id:"bg"+ci, cx:".35", cy:".3", r:".8"}, defs);
  el("stop", {offset:"0", "stop-color":"#ffd27a"}, g);
  el("stop", {offset:".5", "stop-color":"#f58a07"}, g);
  el("stop", {offset:"1", "stop-color":"#b04e00"}, g);

  // 档
  RODX.forEach(x => {
    el("rect", {x:x-2.5, y:30, width:5, height:BASE-30, rx:2.5, fill:"var(--rod)"}, svg);
  });
  // 底部位名
  ["百位","十位","个位"].forEach((t,i)=>{
    el("rect", {x:RODX[i]-30, y:BASE, width:60, height:22, fill:"var(--box)", stroke:"#8a7a3a", "stroke-width":1}, svg);
    const tx = el("text", {x:RODX[i], y:BASE+17, "text-anchor":"middle", "font-size":15, fill:"var(--ink)"}, svg);
    tx.textContent = t;
  });
  // 当前位红框
  const hl = el("rect", {x:RODX[c.pos]-30, y:BASE-1, width:60, height:24, class:"hl", rx:1}, svg);
  // 珠子层
  const beads = el("g", {}, svg);
  // 标签 “6个一”
  const lab = el("text", {x:RODX[c.pos], y:22, "text-anchor":"middle", class:"rodlabel", opacity:0}, svg);
  lab.innerHTML = `6个<tspan class="r">${c.unit}</tspan>`;
  p.appendChild(svg);
  const cap = document.createElement("div"); cap.className = "cap"; p.appendChild(cap);
  board.appendChild(p);
  return {p, svg, beads, lab, hl, cap, ans:p.querySelector(".ans"), defsId:"bg"+ci, count:0, c};
});

// ---------- 步骤 ----------
const steps = [];
COLS.forEach((c, ci) => {
  const P = () => panels[ci];
  steps.push({say:`看<span class="r">${c.name}</span>：${c.n} 就是 <span class="r">2 个${c.unit}</span>。算 ${c.eq} ，就是 3 个“2 个${c.unit}”相加。`,
    run(){ P().p.classList.add("on"); P().hl.classList.add("on");
           P().cap.innerHTML = `${c.name}上拨 <span class="r">2 个${c.unit}</span>，共拨 3 次`; }});
  for (let k = 1; k <= 3; k++){
    steps.push({say:`第 ${k} 次：在${c.name}拨上 2 颗珠子，现在共 <span class="r">${2*k} 个${c.unit}</span>。`,
      run(){ addBeads(P(), 2); P().cap.innerHTML = `第 ${k} 次拨 2 颗　→　共 <span class="r">${2*k} 个${c.unit}</span>`; }});
  }
  steps.push({say:`${c.name}上一共 <span class="r">6 个${c.unit}</span>：2 个${c.unit} × 3 = 6 个${c.unit}，所以 ${c.eq} = <span class="r">${c.m}</span>。`,
    run(){ P().ans.textContent = c.m; P().ans.classList.add("show"); P().lab.setAttribute("opacity",1);
           P().cap.innerHTML = `2 个${c.unit} × 3 = <span class="r">6 个${c.unit}</span>`; }});
});
steps.push({say:`<b>小结：</b>三道算式都是在算 2×3=6，但“2”所在的数位不同，表示的意义也不同——分别是 <span class="r">6 个一、6 个十、6 个百</span>。`,
  run(){ panels.forEach(p=>p.p.classList.add("on")); }});

function addBeads(P, n){
  for (let i = 0; i < n; i++){
    const idx = P.count++;
    const cy = BASE - 8.5 - idx*BH;
    const g = el("g", {class:"bead"}, P.beads);
    g.style.transform = "translateY(-170px)"; g.style.opacity = 0;
    el("ellipse", {cx:RODX[P.c.pos], cy, rx:14.5, ry:7.8, fill:`url(#${P.defsId})`, stroke:"#9a4300", "stroke-width":.6}, g);
    setTimeout(()=>{ g.style.transform = "translateY(0)"; g.style.opacity = 1; }, 30 + i*180);
  }
}

// ---------- 控制 ----------
let cur = 0, playing = false, token = 0;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const spd = () => parseFloat($("speed").value);

function doStep(){
  if (cur >= steps.length) return false;
  const s = steps[cur++];
  s.run(); $("say").innerHTML = s.say;
  updateUI();
  return true;
}
function updateUI(){
  $("next").disabled = playing || cur >= steps.length;
  $("play").textContent = playing ? "❚❚ 暂停" : (cur >= steps.length ? "↻ 重播" : (cur === 0 ? "▶ 播放" : "▶ 继续"));
}
async function play(){
  if (cur >= steps.length) reset();
  playing = true; const my = ++token; updateUI();
  while (playing && my === token && cur < steps.length){
    doStep();
    const last = steps[cur-1].say.includes("总结") ? 0 : 0;
    await sleep((cur===steps.length ? 0 : 1500) / spd());
  }
  if (my === token){ playing = false; updateUI(); }
}
function reset(){
  playing = false; token++; cur = 0;
  panels.forEach(P => {
    P.p.classList.remove("on"); P.hl.classList.remove("on");
    P.beads.innerHTML = ""; P.count = 0; P.lab.setAttribute("opacity",0);
    P.ans.textContent = ""; P.ans.classList.remove("show"); P.cap.innerHTML = "";
  });
  $("say").textContent = "点击「播放」开始演示。";
  updateUI();
}
$("play").onclick = () => { playing ? (playing=false, token++, updateUI()) : play(); };
$("next").onclick = doStep;
$("reset").onclick = reset;
updateUI();

// ---------- 标签页 ----------
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("act", x === b));
  $("sec-demo").classList.toggle("act", b.dataset.t === "demo");
  $("sec-prac").classList.toggle("act", b.dataset.t === "prac");
  const pr = b.dataset.t === "prac";
  $("ttl").textContent = pr ? "拨一拨，算一算" : "拨珠过程演示";
  $("sub").innerHTML = pr ? "先把整十、整百数看成几个十、几个百，再在计数器上拨出结果。点每档下方的 ＋ 拨上一颗珠子，点 － 拨下一颗；也可以直接点档或点珠子，或点「撤销」。"
    : "把整十、整百数看成几个十、几个百，再用表内乘法 <b>2×3=6</b> 来计算。点击「播放」观看，或用「下一步」逐步讲解。";
  if (b.dataset.t !== "demo" && playing){ playing = false; token++; updateUI(); }
});

// ---------- 学生练习（三个算式并排） ----------
const UN = ["百","十","一"], POSN = ["百位","十位","个位"];
const pboard = $("pboard");
let Q = {a:2, b:3}, solved = 0, tried = 0;
const HIST = [];

const pp = [2,1,0].map((_, k) => {            // k=0 个位, 1 十位, 2 百位（与演示顺序一致）
  const pos = 2 - k, mul = [1,10,100][k];
  const p = document.createElement("div"); p.className = "panel on";
  p.innerHTML = `<div class="eq"></div>`;
  const svg = el("svg", {viewBox:"0 0 186 282", class:"pab"});
  const d = el("defs", {}, svg);
  const g = el("radialGradient", {id:"bgP"+k, cx:".35", cy:".3", r:".8"}, d);
  el("stop", {offset:"0","stop-color":"#ffd27a"}, g);
  el("stop", {offset:".5","stop-color":"#f58a07"}, g);
  el("stop", {offset:"1","stop-color":"#b04e00"}, g);
  RODX.forEach(x => el("rect", {x:x-2.5, y:30, width:5, height:BASE-30, rx:2.5, fill:"var(--rod)"}, svg));
  POSN.forEach((t,i)=>{
    el("rect", {x:RODX[i]-30, y:BASE, width:60, height:22, fill:"var(--box)", stroke:"#8a7a3a"}, svg);
    el("text", {x:RODX[i], y:BASE+17, "text-anchor":"middle", "font-size":15, fill:"var(--ink)"}, svg).textContent = t;
  });
  el("rect", {x:RODX[pos]-30, y:BASE-1, width:60, height:24, class:"hl on", rx:1}, svg);
  const beads = el("g", {}, svg);
  const P = {pos, mul, k, p, svg, beads, cnt:[0,0,0], eq:p.querySelector(".eq")};
  RODX.forEach((x,i) => {
    const z = el("rect", {x:x-30, y:20, width:60, height:BASE-20, class:"zone"}, svg);
    z.onclick = () => { if (P.cnt[i] < 9){ P.cnt[i]++; HIST.push([P,i]); draw(P); } };
  });
  svg.appendChild(beads);
  RODX.forEach((x,i) => {   // 每档下方的 − / + 按钮
    [[-15,"−",-1],[15,"+",1]].forEach(([dx,ch,d]) => {
      const g = el("g", {class:"pm"}, svg);
      el("circle", {cx:x+dx, cy:262, r:12, fill: d>0 ? "var(--btn)" : "var(--panel)", stroke:"var(--btn)", "stroke-width":1.5}, g);
      el("text", {x:x+dx, y:269, "text-anchor":"middle", "font-size":22, "font-weight":700, fill: d>0 ? "#fff" : "var(--btn)", "pointer-events":"none"}, g).textContent = ch;
      g.onclick = () => {
        if (d > 0 && P.cnt[i] < 9){ P.cnt[i]++; HIST.push([P,i]); draw(P); }
        if (d < 0 && P.cnt[i] > 0){ P.cnt[i]--; draw(P); }
      };
    });
  });   // 珠子放在点击区上层，才能点到珠子拨下
  p.appendChild(svg);
  const ro = document.createElement("div"); ro.className = "readout";
  ro.innerHTML = `<span>百位 <b>0</b></span><span>十位 <b>0</b></span><span>个位 <b>0</b></span>`;
  p.appendChild(ro); P.ro = ro;
  const fb = document.createElement("div"); fb.className = "fb"; p.appendChild(fb); P.fb = fb;
  pboard.appendChild(p);
  return P;
});

function draw(P){
  P.beads.innerHTML = "";
  P.cnt.forEach((n, r) => {
    for (let t = 0; t < n; t++){
      const g = el("g", {class:"pb"}, P.beads);
      el("ellipse", {cx:RODX[r], cy:BASE-8.5-t*BH, rx:14.5, ry:7.8, fill:`url(#bgP${P.k})`, stroke:"#9a4300", "stroke-width":.6}, g);
      g.onclick = ev => { ev.stopPropagation(); P.cnt[r] = t; draw(P); };   // 点任意一颗，拨下它及其上方的珠子
    }
  });
  P.ro.querySelectorAll("b").forEach((b,i) => b.textContent = P.cnt[i]);
  P.fb.textContent = ""; P.fb.className = "fb";
}

function newQ(){
  const pairs = [];
  for (let a = 2; a <= 4; a++) for (let b = 2; b <= 4; b++) if (a*b <= 9) pairs.push([a,b]);
  Q = pairs[Math.floor(Math.random()*pairs.length)];
  pp.forEach(P => {
    P.eq.innerHTML = `${Q[0]*P.mul} × ${Q[1]} = <span class="r" style="color:var(--red)">?</span>`;
    P.cnt = [0,0,0]; draw(P);
  });
  HIST.length = 0;
  $("score").textContent = solved || tried ? `已全部答对 ${solved} 题，共检查 ${tried} 次` : "";
}

function checkOne(P){
  const [a,b] = Q, u = UN[P.pos], prod = a*b;
  const ok = P.cnt.every((n,i) => n === (i === P.pos ? prod : 0));
  P.fb.className = "fb " + (ok ? "ok" : "no");
  if (ok){
    P.fb.innerHTML = `✔ ${a} 个${u} × ${b} = <span class="r">${prod} 个${u}</span>，${a*P.mul}×${b} = <span class="r">${prod*P.mul}</span>`;
    P.eq.innerHTML = `${a*P.mul} × ${b} = ${prod*P.mul}`;
    return true;
  }
  const used = P.cnt.map((n,i)=>n>0?i:-1).filter(i=>i>=0);
  let msg;
  if (!used.length) msg = "还没有拨珠哦。";
  else if (used.length === 1 && used[0] !== P.pos && P.cnt[used[0]] === prod)
    msg = `个数对了，但数位不对：${a*P.mul} 是 ${a} 个${u}，要拨在<span class="r">${POSN[P.pos]}</span>。`;
  else if (used.length === 1 && used[0] === P.pos)
    msg = `数位对了。${a} 个${u}的 ${b} 倍是几个${u}？`;
  else msg = `再想想：${a} 个${u} × ${b} 是几个${u}？拨在${POSN[P.pos]}。`;
  P.fb.innerHTML = "✘ " + msg;
  P.svg.classList.remove("shake"); void P.svg.getBoundingClientRect(); P.svg.classList.add("shake");
  return false;
}
$("chk").onclick = () => {
  tried++;
  const res = pp.map(checkOne);
  if (res.every(Boolean)) solved++;
  $("score").textContent = (res.every(Boolean) ? "🎉 三题全对！　" : "") + `已全部答对 ${solved} 题，共检查 ${tried} 次`;
};
$("undo").onclick = () => {   // 撤销最近一次拨上的珠子（已被手动拨下的会自动跳过）
  while (HIST.length){
    const [P,r] = HIST.pop();
    if (P.cnt[r] > 0){ P.cnt[r]--; draw(P); return; }
  }
};
$("clr").onclick = () => { HIST.length = 0; pp.forEach(P => { P.cnt = [0,0,0]; draw(P); }); };
$("nq").onclick = newQ;
newQ();
</script>
</body>
</html>
