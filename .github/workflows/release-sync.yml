name: Release Sync
permissions:
  contents: write

on:
  push:
    branches: 
      - main
  workflow_dispatch:
    inputs:
      force_resync:
        description: '是否强制重新同步所有项目（用于刷新排序）'
        required: false
        default: 'false'
  schedule:
    - cron: '0 3 * * *'

jobs:
  sync-job:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: "2dust/v2rayN"
            alias: "v2rayN"
          - source: "2dust/v2rayNG"
            alias: "v2rayNG"
          - source: "orion-lib/OrionTV"
            alias: "OrionTV"
          - source: "MoonTechLab/Selene"
            alias: "Selene"
          - source: "zbezj/HEU_KMS_Activator"
            alias: "HEU_KMS"
          - source: "eritpchy/FingerprintPay"
            alias: "FingerprintPay"   
          - source: "connectbot/connectbot"
            alias: "connectbot"    
          - source: "koreader/koreader"
            alias: "koreader" 
          - source: "Dr-TSNG/ZygiskNext"
            alias: "ZygiskNext" 
          - source: "JingMatrix/LSPosed"
            alias: "LSPosed"  
          - source: "Xposed-Modules-Repo/com.y7.fingerpay"
            alias: "com.y7.fingerpay" 
          - source: "twoone-3/AdGuardHomeForRoot"
            alias: "AdGuardHomeForRoot"               

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ matrix.source }}
          ALIAS: ${{ matrix.alias }}
          FORCE_SYNC: ${{ github.event.inputs.force_resync }}
        run: |
          # 1. 获取上游最新 Tag
          ORIGINAL_TAG=$(gh release view --repo $SOURCE_REPO --json tagName --jq .tagName)
          NEW_TAG="${ALIAS}-${ORIGINAL_TAG}"
          
          echo "Checking $SOURCE_REPO: $ORIGINAL_TAG"

          # 2. 判断是否跳过（除非开启了强制同步）
          if [ "$FORCE_SYNC" != "true" ]; then
            if gh release view $NEW_TAG > /dev/null 2>&1; then
              echo "Version $NEW_TAG exists, skipping."
              exit 0
            fi
          fi

          # 3. 关键：为每个项目产生一个独立的、带最新时间戳的 Commit
          # 这确保了 GitHub 排序时，最后跑完的项目永远在最上面
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p sync_logs
          echo "Update: $(date '+%Y-%m-%d %H:%M:%S') - $SOURCE_REPO" > sync_logs/${ALIAS}.log
          git add sync_logs/${ALIAS}.log
          
          # 解决并发推送冲突的重试逻辑
          for i in {1..5}; do
            git commit -m "Sync timestamp for $ALIAS" && \
            git pull --rebase origin main && \
            git push origin main && break || sleep 5
          done

          # 4. 清理旧版本（包括同名的 Release，确保刷新）
          echo "Cleaning up old releases for $ALIAS..."
          OLD_TAGS=$(gh release list --limit 100 --json tagName --jq ".[].tagName" | grep "^${ALIAS}-" || true)
          for tag in $OLD_TAGS; do
            gh release delete $tag --yes --cleanup-tag
          done

          # 5. 同步资源
          mkdir -p ./temp_assets
          gh release download $ORIGINAL_TAG --repo $SOURCE_REPO --pattern "*" --dir ./temp_assets

          TITLE=$(gh release view $ORIGINAL_TAG --repo $SOURCE_REPO --json name --jq .name)
          [ -z "$TITLE" ] && TITLE=$ORIGINAL_TAG
          
          # 6. 发布新 Release（会自动绑定到刚才创建的最新的 Commit 上）
          gh release create $NEW_TAG ./temp_assets/* \
            --title "[$ALIAS] $TITLE" \
            --notes "Sync Date: $(date '+%Y-%m-%d %H:%M:%S') | Source: https://github.com/$SOURCE_REPO" \
            --latest
          
          echo "Project $ALIAS sync complete!"
